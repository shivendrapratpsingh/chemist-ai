<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Maa Gayatri Pharmacy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#12030a;--marigold:#ffb703;--amber:#ffc078;--palegold:#ffe9ae;--cream:#fff2e0;--green:#10b981;--red:#f43f5e;--orange:#f59e0b;--font:'Segoe UI',system-ui,sans-serif;}
html,body{min-height:100vh;background:var(--bg);color:var(--cream);font-family:var(--font);}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 50% at 50% -5%,rgba(150,30,60,.3) 0%,transparent 70%),linear-gradient(180deg,#12030a,#2b0713);}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.aurora-band{position:fixed;left:-20%;width:140%;border-radius:50%;filter:blur(5px);animation:aur linear infinite;z-index:0;pointer-events:none;}
.ab1{top:8%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,138,31,.6),rgba(255,138,31,.5),transparent);animation-duration:13s;}
.ab2{top:22%;height:1px;background:linear-gradient(90deg,transparent,rgba(150,30,60,.5),rgba(255,138,31,.55),transparent);animation-duration:20s;animation-delay:-7s;}
.ab3{top:65%;height:2px;background:linear-gradient(90deg,transparent,rgba(224,49,107,.4),rgba(255,138,31,.45),transparent);animation-duration:17s;animation-delay:-4s;}
@keyframes aur{0%{transform:translateX(-20%) scaleY(1);}50%{transform:translateX(15%) scaleY(4);}100%{transform:translateX(-20%) scaleY(1);}}
.page{position:relative;z-index:1;}
nav{display:flex;align-items:center;gap:12px;padding:14px 32px;background:rgba(22,4,12,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,138,31,.1);flex-wrap:wrap;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.nav-logo-icon{font-size:20px;filter:drop-shadow(0 0 8px rgba(255,138,31,.7));}
.nav-logo-text{font-size:17px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--palegold),var(--marigold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.spacer{flex:1;}
.nav-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;text-decoration:none;color:var(--amber);border:1px solid rgba(255,138,31,.2);transition:all .2s;cursor:pointer;background:transparent;}
.nav-btn:hover{background:rgba(255,138,31,.1);}
.nav-user{font-size:12px;color:var(--palegold);background:rgba(255,138,31,.08);border:1px solid rgba(255,138,31,.2);border-radius:20px;padding:6px 14px;}
main{max-width:920px;margin:0 auto;padding:40px 20px;}
.page-title{font-size:34px;font-weight:900;background:linear-gradient(135deg,var(--palegold),var(--marigold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;}
.page-sub{font-size:14px;color:rgba(255,192,120,.6);margin-bottom:28px;}
.toolbar{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;align-items:center;}
.action-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border-radius:26px;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer;border:none;transition:all .3s;}
.ab-primary{background:linear-gradient(135deg,#8f1436,#b91c4a,#ff8a1f,#ffb703);color:#fff;box-shadow:0 6px 22px rgba(255,138,31,.3);}
.ab-primary:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(255,138,31,.45);}
.ab-ghost{background:rgba(255,138,31,.05);color:var(--amber);border:1px solid rgba(255,138,31,.28);}
.ab-ghost:hover{background:rgba(255,138,31,.12);transform:translateY(-1px);}
/* Order cards */
.orders-list{display:flex;flex-direction:column;gap:18px;}
.order-card{background:rgba(28,5,16,.88);border:1px solid rgba(255,138,31,.16);border-radius:20px;padding:26px;transition:all .35s;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.25);}
.order-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,138,31,.45),transparent);opacity:0;transition:opacity .3s;}
.order-card:hover{border-color:rgba(255,138,31,.35);transform:translateY(-4px);box-shadow:0 20px 60px rgba(255,138,31,.1);}
.order-card:hover::before{opacity:1;}
.oc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.oc-id{font-size:32px;font-weight:900;letter-spacing:5px;font-family:'Courier New',monospace;background:linear-gradient(135deg,#fbbf24,var(--palegold),var(--marigold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.oc-date{font-size:11px;color:rgba(255,192,120,.45);margin-bottom:4px;}
.s-badge{padding:7px 16px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;}
.s-pending{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:#fcd34d;}
.s-confirmed{background:rgba(255,138,31,.1);border:1px solid rgba(255,138,31,.35);color:var(--amber);}
.s-ready{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.35);color:#6ee7b7;box-shadow:0 0 12px rgba(16,185,129,.12);}
.s-completed{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.22);color:#34d399;}
.s-cancelled{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.28);color:#fda4af;}
.oc-img{width:80px;height:80px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,138,31,.3);cursor:pointer;transition:all .25s;box-shadow:0 4px 20px rgba(255,138,31,.12);}
.oc-img:hover{transform:scale(1.1);border-color:rgba(255,138,31,.6);}
.oc-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid rgba(255,138,31,.09);}
.oc-updated{font-size:11px;color:rgba(255,192,120,.4);}
.copy-btn{background:rgba(255,138,31,.06);border:1px solid rgba(255,138,31,.28);color:var(--amber);border-radius:16px;padding:6px 16px;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;}
.copy-btn:hover{background:rgba(255,138,31,.15);}
.oc-notes{margin-top:12px;font-size:12px;background:rgba(255,138,31,.06);border:1px solid rgba(255,138,31,.14);border-radius:10px;padding:11px 16px;color:rgba(255,233,174,.8);}
/* Empty */
.empty-state{text-align:center;padding:70px 20px;color:rgba(255,192,120,.4);}
.empty-icon{font-size:64px;margin-bottom:20px;filter:drop-shadow(0 0 24px rgba(255,138,31,.35));}
.empty-title{font-size:24px;font-weight:800;margin-bottom:10px;color:rgba(255,233,174,.65);}
.empty-sub{font-size:13px;line-height:1.7;margin-bottom:28px;}
/* Prescription image modal */
#img-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(18,3,10,.96);align-items:center;justify-content:center;backdrop-filter:blur(16px);}
#img-modal.show{display:flex;}
#modal-img{max-width:88vw;max-height:82vh;border-radius:16px;border:1px solid rgba(255,138,31,.35);box-shadow:0 0 100px rgba(255,138,31,.25);}
#modal-close{position:absolute;top:20px;right:24px;font-size:28px;cursor:pointer;color:var(--amber);background:rgba(18,3,10,.6);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;}
#modal-close:hover{color:var(--palegold);background:rgba(255,138,31,.15);}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;display:inline-block;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#dash-toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:none;padding:14px 22px;border-radius:16px;font-size:13px;font-weight:700;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.35);color:#6ee7b7;backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.3);}
@keyframes card-flash{0%{border-color:rgba(16,185,129,.7);box-shadow:0 0 24px rgba(16,185,129,.3);}100%{border-color:rgba(255,138,31,.16);box-shadow:0 4px 24px rgba(0,0,0,.25);}}
.card-updated{animation:card-flash 1.5s ease forwards;}
/* Profile banner */
.profile-banner{background:rgba(28,5,16,.82);border:1px solid rgba(255,138,31,.18);border-radius:18px;padding:20px 24px;margin-bottom:28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 4px 24px rgba(0,0,0,.2);}
.profile-icon{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,rgba(143,20,54,.4),rgba(150,30,60,.4));border:2px solid rgba(255,138,31,.3);display:flex;align-items:center;justify-content:center;font-size:22px;}
.profile-info{flex:1;}
.profile-name{font-size:18px;font-weight:800;color:var(--palegold);}
.profile-hint{font-size:12px;color:rgba(255,192,120,.5);margin-top:3px;}
/* Mobile */
@media(max-width:768px){
  nav{padding:12px 14px;gap:8px;}.nav-logo-text{font-size:14px;}.nav-user{display:none;}
  main{padding:24px 14px;}.page-title{font-size:26px;}
  .oc-id{font-size:22px;letter-spacing:3px;}.oc-img{width:60px;height:60px;}
  .order-card{padding:16px;}.gender-row{flex-direction:column;}
}

/* ── GLOBAL MOBILE FIX ── */
@media(max-width:600px){
  html{font-size:15px;}
  nav{padding:10px 14px !important;gap:6px !important;flex-wrap:wrap;}
  .nav-logo-text{font-size:13px !important;letter-spacing:1px !important;}
  .nav-logo-icon{font-size:18px !important;}
  .spacer{display:none;}
  .nav-btn,.nav-ghost{padding:6px 10px !important;font-size:11px !important;}
  .nav-user{font-size:11px !important;padding:4px 10px !important;}
  main,.section{padding:20px 14px !important;}
  h1{font-size:clamp(26px,9vw,44px) !important;}
  .hero-sub{font-size:13px !important;}
  .btn{width:100% !important;max-width:100% !important;padding:13px 20px !important;font-size:14px !important;}
  .hero-btns{flex-direction:column !important;align-items:stretch !important;}
  .grid-4{grid-template-columns:1fr 1fr !important;}
  .steps{grid-template-columns:1fr 1fr !important;}
  .stats-grid{grid-template-columns:repeat(3,1fr) !important;gap:8px !important;}
  .stat-val{font-size:28px !important;}
  .stat-card{padding:14px 8px !important;}
  .auth-card{padding:28px 18px !important;margin:0 8px;}
  .card{padding:22px 16px !important;border-radius:16px !important;}
  .oc-id{font-size:22px !important;letter-spacing:3px !important;}
  .order-card{padding:16px !important;}
  .oc-img{width:56px !important;height:56px !important;}
  .s-badge{font-size:10px !important;padding:5px 10px !important;}
  .page-title{font-size:26px !important;}
  table{min-width:700px !important;}
  th{font-size:8px !important;padding:8px 8px !important;}
  td{padding:8px 8px !important;font-size:11px !important;}
  .filter-btn{font-size:10px !important;padding:6px 10px !important;}
  .search-input{width:100% !important;}
  .toolbar{flex-direction:column !important;align-items:stretch !important;}
  .action-btn{justify-content:center !important;}
  .profile-banner{gap:12px !important;padding:16px !important;}
  .r-id{font-size:32px !important;letter-spacing:5px !important;}
  footer{font-size:11px !important;padding:20px 14px !important;}
  #qr-section{padding:32px 14px !important;}
  #qr-img{width:150px !important;height:150px !important;}
}
@media(max-width:400px){
  .stats-grid{grid-template-columns:repeat(2,1fr) !important;}
  .grid-4{grid-template-columns:1fr !important;}
  .steps{grid-template-columns:1fr !important;}
  nav a.nav-btn:not(:nth-of-type(2)){display:none !important;}
}


/* ── brand lockup ── */
.nav-logo-mark{width:26px;height:27px;flex:none;filter:drop-shadow(0 0 8px rgba(255,138,31,.5));}
.nav-logo-text{display:flex;flex-direction:column;line-height:1.08;}
.nlt-dev{font-family:'Noto Sans Devanagari','Nirmala UI','Mangal',sans-serif;font-size:10px;
  font-weight:600;color:var(--amber);opacity:.9;letter-spacing:.3px;
  -webkit-text-fill-color:currentColor;}
.nlt-en{font-size:13px;font-weight:900;letter-spacing:1.5px;
  background:linear-gradient(135deg,var(--palegold),var(--marigold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
@media(max-width:600px){
  .nav-logo-mark{width:22px;height:23px;}
  .nlt-dev{font-size:9px;}
  .nlt-en{font-size:11px !important;letter-spacing:1px !important;}
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="aurora-band ab1"></div>
<div class="aurora-band ab2"></div>
<div class="aurora-band ab3"></div>
<div class="page">
<nav>
  <a href="index.html" class="nav-logo"><svg class="nav-logo-mark" viewBox="0 0 100 104" fill="none" aria-hidden="true"><circle cx="50" cy="34" r="24" stroke="rgba(255,192,120,.4)" stroke-width="2"/><g stroke="#ffb703" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 22 L44 11 L50 20 L56 11 L60 22"/><ellipse cx="50" cy="34" rx="9" ry="11"/><path d="M50 50 C44 57 42 68 50 74 C58 68 56 57 50 50 Z" fill="rgba(255,138,31,.25)"/><path d="M41 52 C32 58 29 70 38 75"/><path d="M59 52 C68 58 71 70 62 75"/><path d="M30 84 Q50 96 70 84"/></g></svg><span class="nav-logo-text"><span class="nlt-dev">माँ गायत्री</span><span class="nlt-en">MAA GAYATRI PHARMACY</span></span></a>
  <div class="spacer"></div>
  <span class="nav-user" id="nav-user">Loading…</span>
  <a href="order.html" class="nav-btn">📋 New Order</a>
  <a href="track.html" class="nav-btn">🔍 Track</a>
  <button class="nav-btn" onclick="logout()">🚪 Sign Out</button>
</nav>
<main>
  <div class="page-title">📦 My Orders</div>
  <p class="page-sub" id="user-greeting">Welcome! Here are all your prescription orders.</p>

  <div class="profile-banner">
    <div class="profile-icon">👤</div>
    <div class="profile-info">
      <div class="profile-name" id="profile-name">My Profile</div>
      <div class="profile-hint">Track your prescription orders below</div>
    </div>
  </div>

  <div class="toolbar">
    <a href="order.html" class="action-btn ab-primary">📋 Upload New Prescription</a>
    <button class="action-btn ab-ghost" onclick="loadOrders(false)"><span id="ri">🔄</span> Refresh</button>
    <span id="live-chip" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:11px;font-weight:800;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);color:#6ee7b7;">
      <span style="width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 6px #10b981;animation:blink 1.4s infinite;display:inline-block;"></span>
      LIVE
    </span>
  </div>
  <div id="orders-list" class="orders-list">
    <div class="empty-state"><div class="empty-icon">🪔</div><div class="empty-title">Loading…</div></div>
  </div>
</main>
</div>

<div id="dash-toast"></div>

<!-- Prescription image modal -->
<div id="img-modal" onclick="closeModal()">
  <span id="modal-close">✕</span>
  <img id="modal-img" src="" alt="Prescription"/>
</div>

<script>
const API=window.location.origin;
let user=null;
let _lastHash='';   // fingerprint of last-seen order data
let _pollTimer=null;

// Marigold petal particle system (performance-optimised)
(function(){
  const c=document.getElementById('canvas'),ctx=c.getContext('2d');
  let W,H;
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
  resize();window.addEventListener('resize',resize);
  const isMobile=innerWidth<768;
  const COUNT=isMobile?40:70;
  const GLOW=!isMobile;
  function mkp(){return{x:Math.random()*innerWidth,y:Math.random()*innerHeight,size:Math.random()*14+5,op:0,maxOp:Math.random()*.5+.15,phase:0,hold:90+Math.random()*130,holdN:0,spd:Math.random()*.006+.003,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.35-.06,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.02,type:Math.random()<.28?'d':Math.random()<.52?'h':Math.random()<.72?'x':'dot'};}
  const pts=Array.from({length:COUNT},()=>{const p=mkp();p.op=Math.random()*p.maxOp;p.phase=1;p.holdN=Math.floor(Math.random()*p.hold);return p;});
  let last=0;
  function draw(ts){
    requestAnimationFrame(draw);
    if(ts-last<34)return;
    last=ts;
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      if(p.phase===0){p.op+=p.spd;if(p.op>=p.maxOp){p.op=p.maxOp;p.phase=1;}}
      else if(p.phase===1){p.holdN++;if(p.holdN>=p.hold)p.phase=2;}
      else{p.op-=p.spd;if(p.op<=0){Object.assign(p,mkp());p.op=0;p.phase=0;p.holdN=0;}}
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;
      if(p.x<-40)p.x=W+40;if(p.x>W+40)p.x=-40;if(p.y<-40)p.y=H+40;if(p.y>H+40)p.y=-40;
      const o=p.op,s=p.size;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      if(GLOW){ctx.shadowColor=`rgba(255,150,50,${o*.85})`;ctx.shadowBlur=s*2.5;}
      if(p.type==='d'){ctx.fillStyle=`rgba(255,138,31,${o*.55})`;ctx.strokeStyle=`rgba(255,214,150,${o*.85})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(0,-s*.62);ctx.bezierCurveTo(s*.5,-s*.3,s*.42,s*.42,0,s*.6);ctx.bezierCurveTo(-s*.42,s*.42,-s*.5,-s*.3,0,-s*.62);ctx.closePath();ctx.fill();ctx.stroke();}
      else if(p.type==='h'){ctx.beginPath();ctx.arc(0,0,s*.5,0,Math.PI*2);ctx.fillStyle=`rgba(255,170,70,${o*.4})`;ctx.fill();ctx.beginPath();ctx.arc(0,0,s*.22,0,Math.PI*2);ctx.fillStyle=`rgba(255,226,170,${o*.9})`;ctx.fill();}
      else if(p.type==='x'){ctx.strokeStyle=`rgba(255,214,150,${o*.55})`;ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(0,-s*.5);ctx.lineTo(0,s*.5);ctx.moveTo(-s*.5,0);ctx.lineTo(s*.5,0);ctx.stroke();}
      else{ctx.beginPath();ctx.arc(0,0,s*.3,0,Math.PI*2);ctx.fillStyle=`rgba(255,214,150,${o})`;ctx.fill();}
      ctx.restore();
    });
  }
  requestAnimationFrame(draw);
})();

// ── Session helpers ───────────────────────────────────────────────────────────
function loadSession(){try{const u=JSON.parse(localStorage.getItem('chem_user')||'null');if(u&&u._exp>Date.now())return u;localStorage.removeItem('chem_user');return null;}catch{return null;}}

// Auth
user=loadSession();
if(!user){window.location.href='login.html';}
else if(user.role==='admin'){window.location.href='admin.html';}
else{
  const name=user.name||user.identifier;
  document.getElementById('nav-user').textContent=name+' 👤';
  document.getElementById('user-greeting').textContent=`Welcome${user.name?', '+user.name:''}! Here are all your prescription orders.`;
  document.getElementById('profile-name').textContent=name;
  loadOrders(false);
  startPolling();
}

// ── Live polling ──────────────────────────────────────────────────────────────
function startPolling(){
  if(_pollTimer)clearInterval(_pollTimer);
  _pollTimer=setInterval(()=>loadOrders(true),5000);
}

async function loadOrders(silent=false){
  const ic=document.getElementById('ri');
  if(!silent)ic.className='spin';
  try{
    const r=await fetch(`${API}/api/orders/my?identifier=${encodeURIComponent(user.identifier)}`);
    const d=await r.json();
    const orders=d.orders||[];

    // Fingerprint: status + notes + updated_at per order
    const hash=orders.map(o=>o.order_id+'|'+o.status+'|'+o.notes+'|'+o.updated_at).join(';');

    if(hash!==_lastHash){
      const isUpdate=_lastHash!=='';  // not the first load
      const oldStatuses=Object.fromEntries(
        _lastHash.split(';').filter(Boolean).map(s=>{const p=s.split('|');return[p[0],p[1]];})
      );
      _lastHash=hash;
      renderOrders(orders,isUpdate?oldStatuses:{});
      if(isUpdate)showToast('📬 Order status updated!');
    }
  }catch(e){
    if(!silent)document.getElementById('orders-list').innerHTML=
      '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-title">Connection error</div></div>';
  }
  if(!silent)ic.className='';
}

// ── Render ────────────────────────────────────────────────────────────────────
const SL={pending:'⏳ Pending',confirmed:'✅ Confirmed',ready:'💊 Ready to Collect',completed:'🎉 Completed',cancelled:'❌ Cancelled'};

function imgSrc(o){return o.image_path.startsWith('http')?o.image_path:API+'/uploads/'+o.image_path;}

function renderOrders(orders,oldStatuses={}){
  const el=document.getElementById('orders-list');
  if(!orders.length){
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">💎</div><div class="empty-title">No orders yet</div><div class="empty-sub">Upload your first prescription to get started!</div><a href="order.html" class="action-btn ab-primary" style="display:inline-flex;margin:0 auto">📋 Upload Now</a></div>`;
    return;
  }
  el.innerHTML=orders.map(o=>{
    const changed=oldStatuses[o.order_id]&&oldStatuses[o.order_id]!==o.status;
    return `<div class="order-card${changed?' card-updated':''}" id="card-${o.order_id}">
      <div class="oc-top">
        <div><div class="oc-date">Placed: ${o.created_at}</div><div class="oc-id">${o.order_id}</div></div>
        <div style="display:flex;align-items:center;gap:12px;">
          <img class="oc-img" src="${imgSrc(o)}" onerror="this.style.display='none'" onclick="viewImg('${imgSrc(o)}')"/>
          <span class="s-badge s-${o.status}" id="badge-${o.order_id}">${SL[o.status]||o.status}</span>
        </div>
      </div>
      <div class="oc-bottom">
        <span class="oc-updated">Updated: ${o.updated_at}</span>
        <button class="copy-btn" onclick="copyId('${o.order_id}',this)">📋 Copy ID</button>
      </div>
      ${o.notes?`<div class="oc-notes">📝 ${o.notes}</div>`:''}
    </div>`;
  }).join('');
}

function showToast(msg){
  const t=document.getElementById('dash-toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.style.display='none',4000);
}
function copyId(id,btn){navigator.clipboard.writeText(id).then(()=>{btn.textContent='✅ Copied!';setTimeout(()=>btn.textContent='📋 Copy ID',2000);});}
function viewImg(src){document.getElementById('modal-img').src=src;document.getElementById('img-modal').classList.add('show');}
function closeModal(){document.getElementById('img-modal').classList.remove('show');}
function logout(){localStorage.removeItem('chem_user');window.location.href='login.html';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
</body>
</html>
