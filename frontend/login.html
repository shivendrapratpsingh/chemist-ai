<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Maa Gayatri Pharmacy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#12030a;--bg2:#1c0510;--card:#240810;--border:#5a1622;--border2:#8a2a1f;
  --wine:#b91c4a;--marigold:#ffb703;--amber:#ffc078;--palegold:#ffe9ae;--cream:#fff2e0;
  --green:#10b981;--red:#f43f5e;--orange:#f59e0b;
  --font:'Segoe UI',system-ui,sans-serif;
}
html,body{min-height:100vh;background:var(--bg);color:var(--cream);font-family:var(--font);overflow:hidden;}

/* Aurora background */
body::before{content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(150,30,60,.35) 0%, transparent 70%),
             radial-gradient(ellipse 50% 40% at 80% 20%, rgba(185,28,74,.2) 0%, transparent 60%),
             radial-gradient(ellipse 60% 50% at 20% 80%, rgba(120,20,50,.25) 0%, transparent 60%),
             linear-gradient(180deg,#12030a 0%,#2b0713 50%,#080106 100%);}

canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}

/* Aurora bands */

@keyframes aurora-move{0%{transform:translateX(-15%) scaleY(1);}50%{transform:translateX(10%) scaleY(3);}100%{transform:translateX(-15%) scaleY(1);}}

.page{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

/* Floating crystals */
.crystal-float{position:fixed;pointer-events:none;z-index:1;}
.cf-shape{animation:cf-drift linear infinite;}
@keyframes cf-drift{0%{transform:translateY(100vh) rotate(0deg);opacity:0;}5%{opacity:.7;}90%{opacity:.5;}100%{transform:translateY(-120px) rotate(720deg);opacity:0;}}

/* Card */
.auth-card{width:100%;max-width:460px;
  background:rgba(30,6,18,.9);
  border:1px solid rgba(255,138,31,.25);
  border-radius:26px;padding:50px 46px;
  backdrop-filter:blur(24px);position:relative;overflow:hidden;
  box-shadow:0 0 100px rgba(185,28,74,.2),0 0 40px rgba(255,138,31,.08),0 40px 80px rgba(0,0,0,.6);}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,138,31,.7),rgba(255,233,174,.9),rgba(255,138,31,.7),transparent);}
.auth-card::after{content:'';position:absolute;inset:0;border-radius:26px;
  background:radial-gradient(ellipse 90% 45% at 50% 0%,rgba(255,138,31,.1) 0%,transparent 70%);
  pointer-events:none;}

.logo-area{text-align:center;margin-bottom:32px;}
.logo-icon{font-size:48px;margin-bottom:8px;filter:drop-shadow(0 0 16px rgba(255,138,31,.6));}
.logo-title{font-size:22px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(135deg,var(--palegold),var(--marigold),#ffd9a0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:12px;color:rgba(255,192,120,.6);letter-spacing:1px;margin-top:4px;}

/* Tabs */
.tabs{display:flex;background:rgba(18,3,10,.7);border:1px solid rgba(255,138,31,.15);border-radius:14px;padding:4px;margin-bottom:28px;gap:4px;}
.tab{flex:1;padding:10px;border-radius:11px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;color:rgba(255,192,120,.5);transition:all .25s;letter-spacing:.3px;}
.tab.active{background:linear-gradient(135deg,rgba(185,28,74,.5),rgba(150,30,60,.6));color:var(--palegold);box-shadow:0 0 20px rgba(255,138,31,.2);border:1px solid rgba(255,138,31,.25);}

/* Form */
.form-group{margin-bottom:18px;}
label{display:block;font-size:10px;font-weight:700;color:rgba(255,192,120,.7);margin-bottom:7px;letter-spacing:1px;text-transform:uppercase;}
.input-wrap{position:relative;}
.input-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}
input,select{width:100%;padding:14px 16px 14px 42px;
  background:rgba(18,3,10,.85);border:1px solid rgba(255,138,31,.22);
  border-radius:13px;color:var(--cream);font-size:14px;outline:none;
  transition:all .25s;font-family:var(--font);}
input:focus,select:focus{border-color:rgba(255,138,31,.65);
  box-shadow:0 0 0 3px rgba(255,138,31,.12),0 0 24px rgba(255,138,31,.12);}
input::placeholder{color:rgba(255,192,120,.3);}
select option{background:#240810;}
.id-row{display:grid;grid-template-columns:130px 1fr;gap:10px;}
.id-row input{padding-left:16px;}

/* Button */
.submit-btn{width:100%;margin-top:8px;padding:16px;border-radius:32px;font-size:15px;
  font-weight:900;border:none;cursor:pointer;letter-spacing:.5px;transition:all .3s;
  position:relative;overflow:hidden;}
.submit-btn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.12),transparent);
  opacity:0;transition:opacity .25s;}
.submit-btn:hover::before{opacity:1;}
.submit-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 16px 48px rgba(255,138,31,.45);}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-signin{background:linear-gradient(135deg,#8f1436,#b91c4a,#ff8a1f,#ffb703);
  color:#fff;box-shadow:0 8px 28px rgba(185,28,74,.4);}
.btn-register{background:linear-gradient(135deg,#8f1436,#b91c4a,#ff8a1f,#ffb703);
  color:#fff;box-shadow:0 8px 28px rgba(255,138,31,.35);}

/* Messages */
.msg{display:none;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;margin-top:14px;text-align:center;animation:msgIn .3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.msg-ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#6ee7b7;}
.msg-err{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);color:#fda4af;}

.no-reset{font-size:11px;color:rgba(255,192,120,.4);text-align:center;margin-top:14px;padding:10px 12px;background:rgba(255,138,31,.04);border:1px solid rgba(255,138,31,.08);border-radius:8px;line-height:1.6;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}

.home-link{display:block;text-align:center;margin-top:20px;font-size:12px;color:rgba(255,192,120,.5);text-decoration:none;transition:color .2s;}
.home-link:hover{color:var(--marigold);}

/* ── MOBILE ── */
@media(max-width:600px){
  html,body{overflow:auto;}
  .page{padding:16px;align-items:flex-start;padding-top:32px;}
  .auth-card{padding:32px 22px;border-radius:18px;}
  .logo-icon{font-size:38px;}
  .logo-title{font-size:18px;}
  .tabs{margin-bottom:20px;}
  .tab{font-size:12px;padding:9px 6px;}
  input,select{font-size:16px !important;}
  .submit-btn{padding:14px;}
  .id-row{grid-template-columns:1fr;gap:8px;}
}


.aurora-band{position:fixed;left:-20%;width:140%;border-radius:50%;filter:blur(5px);animation:aur linear infinite;z-index:0;pointer-events:none;}
.ab1{top:8%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,138,31,.6),rgba(255,138,31,.5),transparent);animation-duration:13s;}
.ab2{top:22%;height:1px;background:linear-gradient(90deg,transparent,rgba(150,30,60,.5),rgba(255,138,31,.55),transparent);animation-duration:20s;animation-delay:-7s;}
.ab3{top:65%;height:2px;background:linear-gradient(90deg,transparent,rgba(224,49,107,.4),rgba(255,138,31,.45),transparent);animation-duration:17s;animation-delay:-4s;}
@keyframes aur{0%{transform:translateX(-20%) scaleY(1);}50%{transform:translateX(15%) scaleY(4);}100%{transform:translateX(-20%) scaleY(1);}}

/* ── GLOBAL MOBILE FIX ── */
@media(max-width:600px){
  html{font-size:15px;}
  nav{padding:10px 14px !important;gap:6px !important;flex-wrap:wrap;}
  .nav-logo-text{font-size:13px !important;letter-spacing:1px !important;}
  .nav-logo-icon{font-size:18px !important;}
  .spacer{display:none;}
  .nav-btn,.nav-ghost{padding:6px 10px !important;font-size:11px !important;}
  .nav-user{font-size:11px !important;padding:4px 10px !important;}
  main,.section{padding:20px 14px !important;}
  h1{font-size:clamp(26px,9vw,44px) !important;}
  .hero-sub{font-size:13px !important;}
  .btn{width:100% !important;max-width:100% !important;padding:13px 20px !important;font-size:14px !important;}
  .hero-btns{flex-direction:column !important;align-items:stretch !important;}
  .grid-4{grid-template-columns:1fr 1fr !important;}
  .steps{grid-template-columns:1fr 1fr !important;}
  .stats-grid{grid-template-columns:repeat(3,1fr) !important;gap:8px !important;}
  .stat-val{font-size:28px !important;}
  .stat-card{padding:14px 8px !important;}
  .auth-card{padding:28px 18px !important;margin:0 8px;}
  .card{padding:22px 16px !important;border-radius:16px !important;}
  .oc-id{font-size:22px !important;letter-spacing:3px !important;}
  .order-card{padding:16px !important;}
  .oc-img{width:56px !important;height:56px !important;}
  .s-badge{font-size:10px !important;padding:5px 10px !important;}
  .page-title{font-size:26px !important;}
  table{min-width:700px !important;}
  th{font-size:8px !important;padding:8px 8px !important;}
  td{padding:8px 8px !important;font-size:11px !important;}
  .filter-btn{font-size:10px !important;padding:6px 10px !important;}
  .search-input{width:100% !important;}
  .toolbar{flex-direction:column !important;align-items:stretch !important;}
  .action-btn{justify-content:center !important;}
  .dx-grid{grid-template-columns:1fr 1fr !important;}
  .dx-inner{padding:20px 14px 40px !important;}
  .dx-title{font-size:22px !important;}
  .gender-row{flex-direction:row !important;gap:8px !important;}
  .gender-btn{padding:12px 8px !important;font-size:18px !important;}
  .profile-banner{gap:12px !important;padding:16px !important;}
  .dx-open-btn{font-size:12px !important;padding:8px 14px !important;}
  .profile-avatar,.profile-avatar-placeholder{width:56px !important;height:56px !important;}
  .r-id{font-size:32px !important;letter-spacing:5px !important;}
  footer{font-size:11px !important;padding:20px 14px !important;}
  #qr-section{padding:32px 14px !important;}
  #qr-img{width:150px !important;height:150px !important;}
}
@media(max-width:400px){
  .stats-grid{grid-template-columns:repeat(2,1fr) !important;}
  .grid-4{grid-template-columns:1fr !important;}
  .steps{grid-template-columns:1fr !important;}
  nav a.nav-btn:not(:nth-of-type(2)){display:none !important;}
}


.logo-mark{width:62px;height:64px;filter:drop-shadow(0 0 14px rgba(255,138,31,.55));}
.logo-title{font-size:19px !important;letter-spacing:2px !important;}
@media(max-width:600px){.logo-mark{width:52px;height:54px;}.logo-title{font-size:16px !important;}}
</style>
</head>
<body>
<script src="/static/intro.js"></script>
<canvas id="canvas"></canvas>
<div class="aurora-band ab1"></div>
<div class="aurora-band ab2"></div>
<div class="aurora-band ab3"></div>
<div class="page">
  <div class="auth-card">
    <div class="logo-area">
      <div class="logo-icon"><svg class="logo-mark" viewBox="0 0 100 104" fill="none" aria-hidden="true"><circle cx="50" cy="34" r="24" stroke="rgba(255,192,120,.4)" stroke-width="2"/><g stroke="#ffb703" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 22 L44 11 L50 20 L56 11 L60 22"/><ellipse cx="50" cy="34" rx="9" ry="11"/><path d="M50 50 C44 57 42 68 50 74 C58 68 56 57 50 50 Z" fill="rgba(255,138,31,.25)"/><path d="M41 52 C32 58 29 70 38 75"/><path d="M59 52 C68 58 71 70 62 75"/><path d="M30 84 Q50 96 70 84"/></g></svg></div>
      <div class="logo-title">MAA GAYATRI PHARMACY</div>
      <div class="logo-sub">आपके स्वास्थ्य की सेवा में</div>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">📱 Sign In</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">✨ New Account</div>
    </div>

    <!-- Sign In — phone only (password auto-appears for admin email) -->
    <div id="form-login">
      <div class="form-group">
        <label id="l-id-label">Your Phone Number</label>
        <div class="input-wrap">
          <span class="icon" id="l-id-icon">📱</span>
          <input type="text" id="l-id" placeholder="e.g. 9876543210" autocomplete="username"
                 inputmode="numeric" oninput="onIdInput(this)" onkeydown="if(event.key==='Enter')doLogin()"/>
        </div>
      </div>
      <div class="form-group" id="pw-group" style="display:none">
        <label>Password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input type="password" id="l-pw" placeholder="Enter password" autocomplete="current-password"
                 onkeydown="if(event.key==='Enter')doLogin()"/>
        </div>
      </div>
      <button class="submit-btn btn-signin" id="btn-login" onclick="doLogin()">Sign In</button>
      <div class="no-reset" id="l-hint">💡 Just enter your registered phone number — no password needed!</div>
      <div class="msg" id="login-msg"></div>
    </div>

    <!-- Register — name + phone only -->
    <div id="form-register" style="display:none">
      <div class="form-group">
        <label>Your Full Name</label>
        <div class="input-wrap">
          <span class="icon">🙂</span>
          <input type="text" id="r-name" placeholder="e.g. Rajesh Kumar" autocomplete="name"/>
        </div>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <div class="input-wrap">
          <span class="icon">📱</span>
          <input type="tel" id="r-id" placeholder="e.g. 9876543210" autocomplete="tel"
                 inputmode="numeric" onkeydown="if(event.key==='Enter')doRegister()"/>
        </div>
      </div>
      <button class="submit-btn btn-register" id="btn-register" onclick="doRegister()">Create Account</button>
      <div class="no-reset">💡 Your phone number is your unique ID — no password required. Simple &amp; secure!</div>
      <div class="msg" id="reg-msg"></div>
    </div>

    <a href="index.html" class="home-link">← Back to Home</a>
  </div>
</div>

<script>
const API = window.location.origin;

// ── Marigold petal particle system (performance-optimised) ──────────────────────────
(function(){
  const c=document.getElementById('canvas'),ctx=c.getContext('2d');
  let W,H;
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
  resize();window.addEventListener('resize',resize);
  const isMobile=innerWidth<768;
  const COUNT=isMobile?40:70;
  const GLOW=!isMobile;
  function mkp(){return{x:Math.random()*innerWidth,y:Math.random()*innerHeight,size:Math.random()*14+5,op:0,maxOp:Math.random()*.5+.15,phase:0,hold:90+Math.random()*130,holdN:0,spd:Math.random()*.006+.003,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.35-.06,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.02,type:Math.random()<.28?'d':Math.random()<.52?'h':Math.random()<.72?'x':'dot'};}
  const pts=Array.from({length:COUNT},()=>{const p=mkp();p.op=Math.random()*p.maxOp;p.phase=1;p.holdN=Math.floor(Math.random()*p.hold);return p;});
  let last=0;
  function draw(ts){
    requestAnimationFrame(draw);
    if(ts-last<34)return;
    last=ts;
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      if(p.phase===0){p.op+=p.spd;if(p.op>=p.maxOp){p.op=p.maxOp;p.phase=1;}}
      else if(p.phase===1){p.holdN++;if(p.holdN>=p.hold)p.phase=2;}
      else{p.op-=p.spd;if(p.op<=0){Object.assign(p,mkp());p.op=0;p.phase=0;p.holdN=0;}}
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;
      if(p.x<-40)p.x=W+40;if(p.x>W+40)p.x=-40;if(p.y<-40)p.y=H+40;if(p.y>H+40)p.y=-40;
      const o=p.op,s=p.size;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      if(GLOW){ctx.shadowColor=`rgba(255,150,50,${o*.85})`;ctx.shadowBlur=s*2.5;}
      if(p.type==='d'){ctx.fillStyle=`rgba(255,138,31,${o*.55})`;ctx.strokeStyle=`rgba(255,214,150,${o*.85})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(0,-s*.62);ctx.bezierCurveTo(s*.5,-s*.3,s*.42,s*.42,0,s*.6);ctx.bezierCurveTo(-s*.42,s*.42,-s*.5,-s*.3,0,-s*.62);ctx.closePath();ctx.fill();ctx.stroke();}
      else if(p.type==='h'){ctx.beginPath();ctx.arc(0,0,s*.5,0,Math.PI*2);ctx.fillStyle=`rgba(255,170,70,${o*.4})`;ctx.fill();ctx.beginPath();ctx.arc(0,0,s*.22,0,Math.PI*2);ctx.fillStyle=`rgba(255,226,170,${o*.9})`;ctx.fill();}
      else if(p.type==='x'){ctx.strokeStyle=`rgba(255,214,150,${o*.55})`;ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(0,-s*.5);ctx.lineTo(0,s*.5);ctx.moveTo(-s*.5,0);ctx.lineTo(s*.5,0);ctx.stroke();}
      else{ctx.beginPath();ctx.arc(0,0,s*.3,0,Math.PI*2);ctx.fillStyle=`rgba(255,214,150,${o})`;ctx.fill();}
      ctx.restore();
    });
  }
  requestAnimationFrame(draw);
})();

// ── Session helpers (localStorage, 7-day expiry) ─────────────────────────────
const SESSION_TTL = 7 * 24 * 60 * 60 * 1000; // 7 days ms
function saveSession(user){ localStorage.setItem('chem_user', JSON.stringify({...user, _exp: Date.now()+SESSION_TTL})); }
function loadSession(){ try{ const u=JSON.parse(localStorage.getItem('chem_user')||'null'); if(u&&u._exp>Date.now())return u; localStorage.removeItem('chem_user'); return null; }catch{return null;} }

// Redirect if already logged in
const saved = loadSession();
if(saved){ window.location.href = saved.role==='admin' ? 'admin.html' : 'dashboard.html'; }

if(new URLSearchParams(location.search).get('tab')==='register') switchTab('register');

function switchTab(t){
  document.getElementById('form-login').style.display    = t==='login'    ? 'block':'none';
  document.getElementById('form-register').style.display = t==='register' ? 'block':'none';
  document.getElementById('tab-login').className    = 'tab'+(t==='login'   ?' active':'');
  document.getElementById('tab-register').className = 'tab'+(t==='register'?' active':'');
}

function onIdInput(inp){
  const isEmail = inp.value.includes('@');
  document.getElementById('pw-group').style.display = isEmail ? 'block' : 'none';
  document.getElementById('l-id-label').textContent  = isEmail ? 'Admin Email' : 'Your Phone Number';
  document.getElementById('l-id-icon').textContent   = isEmail ? '👤' : '📱';
  inp.inputMode = isEmail ? 'text' : 'numeric';
  document.getElementById('l-hint').textContent = isEmail
    ? '🔐 Admin login — enter your email and password.'
    : '💡 Just enter your registered phone number — no password needed!';
}

async function doLogin(){
  const id = document.getElementById('l-id').value.trim().replace(/\s+/g,'');
  if(!id){ showMsg('login-msg',false,'Please enter your phone number.'); return; }
  const pw = (document.getElementById('l-pw')||{value:''}).value;
  const isEmail = id.includes('@');
  if(isEmail && !pw){ showMsg('login-msg',false,'Please enter your password.'); return; }
  const btn = document.getElementById('btn-login');
  btn.innerHTML='<span class="spinner"></span>Signing in…'; btn.disabled=true;
  try{
    const fd = new FormData();
    fd.append('identifier', id);
    if(pw) fd.append('password', pw);
    const r = await fetch(`${API}/api/auth/login`,{method:'POST',body:fd});
    const d = await r.json();
    if(d.success){
      saveSession(d.user);
      showMsg('login-msg',true,'✅ Welcome! Redirecting…');
      setTimeout(()=>{ window.location.href = d.user.role==='admin' ? 'admin.html' : 'dashboard.html'; }, 600);
    } else { showMsg('login-msg',false,d.message||'Not found. Check your number or create an account.'); }
  } catch(e){ showMsg('login-msg',false,'Connection error. Is the server running?'); }
  btn.innerHTML='Sign In'; btn.disabled=false;
}

async function doRegister(){
  const name = document.getElementById('r-name').value.trim();
  const id   = document.getElementById('r-id').value.trim().replace(/\s+/g,'');
  if(!id){ showMsg('reg-msg',false,'Please enter your phone number.'); return; }
  if(!name){ showMsg('reg-msg',false,'Please enter your name.'); return; }
  const btn = document.getElementById('btn-register');
  btn.innerHTML='<span class="spinner"></span>Creating…'; btn.disabled=true;
  try{
    const fd = new FormData();
    fd.append('identifier', id);
    fd.append('id_type', 'phone');
    fd.append('name', name);
    // No password — phone-only auth
    const r = await fetch(`${API}/api/auth/register`,{method:'POST',body:fd});
    const d = await r.json();
    if(d.success){
      saveSession({...d.user, role:'customer'});
      showMsg('reg-msg',true,'✅ Account created! Welcome 🎉');
      setTimeout(()=>{ window.location.href='dashboard.html'; }, 700);
    } else { showMsg('reg-msg',false,d.message||'Registration failed.'); }
  } catch(e){ showMsg('reg-msg',false,'Connection error.'); }
  btn.innerHTML='Create Account'; btn.disabled=false;
}

function showMsg(id,ok,msg){
  const el=document.getElementById(id);
  el.className='msg '+(ok?'msg-ok':'msg-err'); el.textContent=msg; el.style.display='block';
}
</script>
</body>
</html>
