<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order — Maa Gayatri Pharmacy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#12030a;--card:#240810;--marigold:#ffb703;--amber:#ffc078;--palegold:#ffe9ae;--cream:#fff2e0;--green:#10b981;--red:#f43f5e;--orange:#f59e0b;--font:'Segoe UI',system-ui,sans-serif;}
html,body{min-height:100vh;background:var(--bg);color:var(--cream);font-family:var(--font);}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 50% at 50% -5%,rgba(150,30,60,.3) 0%,transparent 70%),linear-gradient(180deg,#12030a,#2b0713);}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.aurora-band{position:fixed;left:-20%;width:140%;border-radius:50%;filter:blur(5px);animation:aur linear infinite;z-index:0;pointer-events:none;}
.ab1{top:10%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,138,31,.45),transparent);animation-duration:16s;}
.page{position:relative;z-index:1;}
nav{display:flex;align-items:center;gap:12px;padding:16px 32px;background:rgba(22,4,12,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,138,31,.1);}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.nav-logo-icon{font-size:20px;filter:drop-shadow(0 0 8px rgba(255,138,31,.7));}
.nav-logo-text{font-size:17px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--palegold),var(--marigold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.spacer{flex:1;}
.nav-btn{padding:7px 18px;border-radius:20px;font-size:12px;font-weight:600;text-decoration:none;color:var(--amber);border:1px solid rgba(255,138,31,.2);transition:all .2s;}
.nav-btn:hover{background:rgba(255,138,31,.1);}

main{max-width:580px;margin:0 auto;padding:50px 20px;}

.card{background:rgba(28,5,16,.9);border:1px solid rgba(255,138,31,.22);
  border-radius:24px;padding:44px;backdrop-filter:blur(20px);
  position:relative;overflow:hidden;
  box-shadow:0 0 80px rgba(185,28,74,.16),0 0 30px rgba(255,138,31,.06),0 40px 80px rgba(0,0,0,.4);}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,138,31,.65),rgba(255,233,174,.85),rgba(255,138,31,.65),transparent);}
.card::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 75% 40% at 50% 0%,rgba(255,138,31,.09),transparent);
  pointer-events:none;}
.card-title{font-size:30px;font-weight:900;
  background:linear-gradient(135deg,var(--palegold),var(--marigold),#ffd9a0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;}
.card-sub{font-size:13px;color:rgba(255,192,120,.62);margin-bottom:30px;}

label{display:block;font-size:10px;font-weight:800;color:rgba(255,192,120,.7);
  margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;}
input{width:100%;padding:18px;
  background:rgba(18,3,10,.85);border:1px solid rgba(255,138,31,.25);
  border-radius:14px;color:var(--cream);font-size:28px;font-weight:900;
  letter-spacing:8px;text-align:center;font-family:'Courier New',monospace;
  outline:none;text-transform:uppercase;transition:all .25s;}
input:focus{border-color:rgba(255,138,31,.65);
  box-shadow:0 0 0 3px rgba(255,138,31,.12),0 0 28px rgba(255,138,31,.12);}
input::placeholder{font-size:14px;letter-spacing:normal;font-family:var(--font);
  font-weight:400;color:rgba(255,192,120,.3);}

.btn{width:100%;margin-top:20px;padding:16px;border-radius:32px;
  background:linear-gradient(135deg,#8f1436,#b91c4a,#ff8a1f,#ffb703);
  color:#fff;font-size:15px;font-weight:900;border:none;cursor:pointer;
  transition:all .3s;box-shadow:0 8px 28px rgba(255,138,31,.32);}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 42px rgba(255,138,31,.45);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

#result{display:none;margin-top:30px;}
.result-card{background:rgba(28,5,16,.88);border:1px solid rgba(255,138,31,.18);
  border-radius:20px;padding:28px;position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.2);}
.result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,138,31,.5),transparent);}
.r-id{font-size:48px;font-weight:900;letter-spacing:8px;font-family:'Courier New',monospace;
  text-align:center;margin-bottom:18px;
  background:linear-gradient(135deg,#fbbf24,var(--palegold),var(--marigold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 8px rgba(251,191,36,.2));}

.s-badge{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;
  border-radius:24px;font-size:13px;font-weight:800;letter-spacing:.3px;}
.s-pending{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:#fcd34d;
  box-shadow:0 0 14px rgba(245,158,11,.1);}
.s-confirmed{background:rgba(255,138,31,.1);border:1px solid rgba(255,138,31,.35);color:var(--amber);
  box-shadow:0 0 14px rgba(255,138,31,.1);}
.s-ready{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.35);color:#6ee7b7;
  box-shadow:0 0 14px rgba(16,185,129,.12);}
.s-completed{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.22);color:#34d399;}
.s-cancelled{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.28);color:#fda4af;}
.s-wrap{text-align:center;margin-bottom:20px;}

/* Timeline */
.timeline{display:flex;justify-content:center;margin:20px 0;gap:0;}
.tl-step{flex:1;text-align:center;position:relative;max-width:90px;}
.tl-step::before{content:'';position:absolute;top:14px;left:50%;right:-50%;height:2px;
  background:rgba(255,138,31,.18);}
.tl-step:last-child::before{display:none;}
.tl-dot{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,138,31,.28);
  background:rgba(18,3,10,.85);display:flex;align-items:center;justify-content:center;
  margin:0 auto 6px;font-size:11px;position:relative;z-index:1;transition:all .3s;}
.tl-dot.done{background:linear-gradient(135deg,#8f1436,#ff8a1f);border-color:transparent;
  box-shadow:0 0 16px rgba(255,138,31,.4);}
.tl-dot.active{background:linear-gradient(135deg,#b45309,#d97706);border-color:transparent;
  box-shadow:0 0 20px rgba(245,158,11,.45);}
.tl-label{font-size:9px;color:rgba(255,192,120,.55);font-weight:700;
  text-transform:uppercase;letter-spacing:.3px;}

.r-meta{display:flex;flex-direction:column;gap:2px;}
.r-row{display:flex;justify-content:space-between;font-size:12px;padding:8px 0;
  border-bottom:1px solid rgba(255,138,31,.09);}
.r-row:last-child{border:none;}
.r-lbl{color:rgba(255,192,120,.55);}
.r-val{color:var(--palegold);font-weight:700;}
.r-img{width:100%;max-height:210px;object-fit:cover;border-radius:14px;
  border:1px solid rgba(255,138,31,.28);margin-bottom:16px;cursor:pointer;
  box-shadow:0 8px 28px rgba(255,138,31,.12);}
.r-notes{margin-top:14px;font-size:12px;background:rgba(255,138,31,.07);
  border:1px solid rgba(255,138,31,.16);border-radius:10px;padding:12px 16px;
  color:rgba(255,233,174,.85);}
.not-found{text-align:center;padding:28px;color:#fda4af;font-size:14px;}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Live pill */
#track-live{display:none;margin-top:14px;text-align:center;}
.live-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:800;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);color:#6ee7b7;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 6px #10b981;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#track-toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:none;padding:14px 22px;border-radius:16px;font-size:13px;font-weight:700;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.35);color:#6ee7b7;backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.3);}
@keyframes status-flash{0%{box-shadow:0 0 0 4px rgba(16,185,129,.5),0 8px 32px rgba(0,0,0,.2);}100%{box-shadow:0 8px 32px rgba(0,0,0,.2);}}
.status-updated{animation:status-flash 1.5s ease forwards;}
/* ── MOBILE ── */
@media(max-width:768px){
  nav{padding:12px 16px;}
  .nav-logo-text{font-size:14px;}
  nav .nav-btn{font-size:11px;padding:6px 10px;}
  main{padding:24px 14px;}
  .card{padding:26px 18px;}
  .card-title{font-size:22px;}
  input{font-size:22px;letter-spacing:5px;padding:14px;}
  .btn{padding:14px;}
  .r-id{font-size:34px;letter-spacing:5px;}
  .timeline{gap:0;padding:0 4px;}
  .tl-label{font-size:8px;}
  .tl-dot{width:24px;height:24px;font-size:10px;}
  .r-row{font-size:11px;}
}
@media(max-width:480px){
  input{font-size:20px;letter-spacing:4px;}
  .r-id{font-size:28px;letter-spacing:4px;}
}


.aurora-band{position:fixed;left:-20%;width:140%;border-radius:50%;filter:blur(5px);animation:aur linear infinite;z-index:0;pointer-events:none;}
.ab1{top:8%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,138,31,.6),rgba(255,138,31,.5),transparent);animation-duration:13s;}
.ab2{top:22%;height:1px;background:linear-gradient(90deg,transparent,rgba(150,30,60,.5),rgba(255,138,31,.55),transparent);animation-duration:20s;animation-delay:-7s;}
.ab3{top:65%;height:2px;background:linear-gradient(90deg,transparent,rgba(224,49,107,.4),rgba(255,138,31,.45),transparent);animation-duration:17s;animation-delay:-4s;}
@keyframes aur{0%{transform:translateX(-20%) scaleY(1);}50%{transform:translateX(15%) scaleY(4);}100%{transform:translateX(-20%) scaleY(1);}}

  html{font-size:15px;}
  nav{padding:10px 14px !important;gap:6px !important;flex-wrap:wrap;}

/* ── brand lockup ── */

.nav-logo-text{display:flex;flex-direction:column;line-height:1.08;}

  font-weight:600;color:var(--amber);opacity:.9;letter-spacing:.3px;
  -webkit-text-fill-color:currentColor;}

<body>
<script src="/static/intro.js"></script>
<canvas id="canvas"></canvas>
<div class="aurora-band ab1"></div>
<div class="aurora-band ab2"></div>
<div class="aurora-band ab3"></div>
<div class="page">
<nav>
  <a href="index.html" class="nav-logo"><svg class="nav-logo-mark" viewBox="0 0 100 104" fill="none" aria-hidden="true"><circle cx="50" cy="34" r="24" stroke="rgba(255,192,120,.4)" stroke-width="2"/><g stroke="#ffb703" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 22 L44 11 L50 20 L56 11 L60 22"/><ellipse cx="50" cy="34" rx="9" ry="11"/><path d="M50 50 C44 57 42 68 50 74 C58 68 56 57 50 50 Z" fill="rgba(255,138,31,.25)"/><path d="M41 52 C32 58 29 70 38 75"/><path d="M59 52 C68 58 71 70 62 75"/><path d="M30 84 Q50 96 70 84"/></g></svg><span class="nav-logo-text"><span class="nlt-dev">माँ गायत्री</span><span class="nlt-en">MAA GAYATRI PHARMACY</span></span></a>
  <div class="spacer"></div>
  <a href="order.html" class="nav-btn">📋 New Order</a>
  <a href="login.html" class="nav-btn" style="margin-left:6px">👤 Account</a>
</nav>
<main>
  <div class="card">
    <div class="card-title">🔍 Track Order</div>
    <div class="card-sub">Enter your 5-letter order ID to see the current status</div>
    <label>Order ID</label>
    <input type="text" id="oid" maxlength="5" placeholder="e.g. AB3XY" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')" onkeydown="if(event.key==='Enter')track()" autofocus/>
    <button class="btn" id="track-btn" onclick="track()">🔍 Check Status</button>
    <div id="track-live"><span class="live-pill"><span class="live-dot"></span>LIVE — auto-updating every 5s</span></div>
    <div id="result"></div>
  </div>
</main>
</div>
<script>
const API=window.location.origin;
let _pollTimer=null;
let _lastStatus='';
let _lastUpdated='';
let _trackingId='';

// ── Marigold petal particle system (performance-optimised) ─────────────────────
(function(){
  const c=document.getElementById('canvas'),ctx=c.getContext('2d');
  let W,H;
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
  resize();window.addEventListener('resize',resize);
  const isMobile=innerWidth<768;
  const COUNT=isMobile?40:70;
  const GLOW=!isMobile;
  function mkp(){return{x:Math.random()*innerWidth,y:Math.random()*innerHeight,size:Math.random()*14+5,op:0,maxOp:Math.random()*.5+.15,phase:0,hold:90+Math.random()*130,holdN:0,spd:Math.random()*.006+.003,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.35-.06,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.02,type:Math.random()<.28?'d':Math.random()<.52?'h':Math.random()<.72?'x':'dot'};}
  const pts=Array.from({length:COUNT},()=>{const p=mkp();p.op=Math.random()*p.maxOp;p.phase=1;p.holdN=Math.floor(Math.random()*p.hold);return p;});
  let last=0;
  function draw(ts){
    requestAnimationFrame(draw);
    if(ts-last<34)return;
    last=ts;
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      if(p.phase===0){p.op+=p.spd;if(p.op>=p.maxOp){p.op=p.maxOp;p.phase=1;}}
      else if(p.phase===1){p.holdN++;if(p.holdN>=p.hold)p.phase=2;}
      else{p.op-=p.spd;if(p.op<=0){Object.assign(p,mkp());p.op=0;p.phase=0;p.holdN=0;}}
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;
      if(p.x<-40)p.x=W+40;if(p.x>W+40)p.x=-40;if(p.y<-40)p.y=H+40;if(p.y>H+40)p.y=-40;
      const o=p.op,s=p.size;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      if(GLOW){ctx.shadowColor=`rgba(255,150,50,${o*.85})`;ctx.shadowBlur=s*2.5;}
      if(p.type==='d'){ctx.fillStyle=`rgba(255,138,31,${o*.55})`;ctx.strokeStyle=`rgba(255,214,150,${o*.85})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(0,-s*.62);ctx.bezierCurveTo(s*.5,-s*.3,s*.42,s*.42,0,s*.6);ctx.bezierCurveTo(-s*.42,s*.42,-s*.5,-s*.3,0,-s*.62);ctx.closePath();ctx.fill();ctx.stroke();}
      else if(p.type==='h'){ctx.beginPath();ctx.arc(0,0,s*.5,0,Math.PI*2);ctx.fillStyle=`rgba(255,170,70,${o*.4})`;ctx.fill();ctx.beginPath();ctx.arc(0,0,s*.22,0,Math.PI*2);ctx.fillStyle=`rgba(255,226,170,${o*.9})`;ctx.fill();}
      else if(p.type==='x'){ctx.strokeStyle=`rgba(255,214,150,${o*.55})`;ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(0,-s*.5);ctx.lineTo(0,s*.5);ctx.moveTo(-s*.5,0);ctx.lineTo(s*.5,0);ctx.stroke();}
      else{ctx.beginPath();ctx.arc(0,0,s*.3,0,Math.PI*2);ctx.fillStyle=`rgba(255,214,150,${o})`;ctx.fill();}
      ctx.restore();
    });
  }
  requestAnimationFrame(draw);
})();

const _saved=sessionStorage.getItem('last_order');
if(_saved)document.getElementById('oid').value=_saved;

// ── Track (manual button) ─────────────────────────────────────────────────────
async function track(){
  const id=document.getElementById('oid').value.trim().toUpperCase();
  if(id.length<5){show('<div class="not-found">⚠️ Please enter a valid 5-character order ID.</div>');return;}
  const btn=document.getElementById('track-btn');
  btn.innerHTML='<span class="spinner"></span>Checking…';btn.disabled=true;
  try{
    const r=await fetch(`${API}/api/orders/track/${id}`);const d=await r.json();
    if(d.success){
      _trackingId=id;
      _lastStatus=d.order.status;
      _lastUpdated=d.order.updated_at;
      renderOrder(d.order,false);
      startTrackPolling(id);
    }else{
      stopTrackPolling();
      show(`<div class="not-found">❌ Order <b>${id}</b> not found. Please check the ID.</div>`);
    }
  }catch(e){show('<div class="not-found">📡 Connection error.</div>');}
  btn.innerHTML='🔍 Check Status';btn.disabled=false;
}

// ── Polling ───────────────────────────────────────────────────────────────────
const FINAL_STATUSES=['completed','cancelled'];

function startTrackPolling(id){
  stopTrackPolling();
  if(FINAL_STATUSES.includes(_lastStatus))return; // already done, no need to poll
  document.getElementById('track-live').style.display='block';
  _pollTimer=setInterval(()=>silentPoll(id),5000);
}

function stopTrackPolling(){
  if(_pollTimer){clearInterval(_pollTimer);_pollTimer=null;}
  document.getElementById('track-live').style.display='none';
}

async function silentPoll(id){
  try{
    const r=await fetch(`${API}/api/orders/track/${id}`);
    const d=await r.json();
    if(!d.success)return;
    const o=d.order;
    if(o.updated_at!==_lastUpdated){
      const changed=o.status!==_lastStatus;
      _lastStatus=o.status;
      _lastUpdated=o.updated_at;
      renderOrder(o,changed);
      if(changed)showToast('🔔 Your order status updated!');
      if(FINAL_STATUSES.includes(o.status))stopTrackPolling();
    }
  }catch(e){/* silent */}
}

// ── Render ────────────────────────────────────────────────────────────────────
const sLabel={pending:'⏳ Pending Review',confirmed:'✅ Confirmed — Being Prepared',ready:'💊 Ready to Collect!',completed:'🎉 Completed',cancelled:'❌ Cancelled'};
const sSteps=['pending','confirmed','ready','completed'];

function imgSrc(o){return o.image_path.startsWith('http')?o.image_path:API+'/uploads/'+o.image_path;}

function renderOrder(o,flash=false){
  const si=sSteps.indexOf(o.status);
  const tlHtml=sSteps.map((s,i)=>{
    let cls='tl-dot';if(i<si)cls+=' done';else if(i===si)cls+=' active';
    const icons=['⏳','✅','💊','🎉'];const labels=['Received','Confirmed','Ready','Done'];
    return `<div class="tl-step"><div class="${cls}">${icons[i]}</div><div class="tl-label">${labels[i]}</div></div>`;
  }).join('');
  show(`<div class="result-card${flash?' status-updated':''}">
    <div class="r-id">${o.order_id}</div>
    <div class="s-wrap"><span class="s-badge s-${o.status}">${sLabel[o.status]||o.status}</span></div>
    <div class="timeline">${tlHtml}</div>
    <img class="r-img" src="${imgSrc(o)}" onerror="this.style.display='none'" onclick="window.open(this.src,'_blank')" title="Click to view full prescription"/>
    <div class="r-meta">
      <div class="r-row"><span class="r-lbl">Order Placed</span><span class="r-val">${o.created_at}</span></div>
      <div class="r-row"><span class="r-lbl">Last Updated</span><span class="r-val">${o.updated_at}</span></div>
    </div>
    ${o.notes?`<div class="r-notes">📝 Pharmacist note: ${o.notes}</div>`:''}
  </div>`);
}

function show(html){const el=document.getElementById('result');el.innerHTML=html;el.style.display='block';el.scrollIntoView({behavior:'smooth'});}

function showToast(msg){
  const t=document.getElementById('track-toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.style.display='none',4000);
}
</script>
<div id="track-toast"></div>
</body>
</html>
