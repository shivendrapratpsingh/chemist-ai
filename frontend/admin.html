<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Rama Chemist</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#030b18;--bg2:#040e1f;--card:#071828;--border:#0e3a5c;
  --crystal:#38bdf8;--frost:#7dd3fc;--aurora:#bae6fd;--diamond:#e0f9ff;
  --sapphire:#0284c7;--deep-blue:#0369a1;
  --green:#10b981;--red:#f43f5e;--orange:#f59e0b;--purple:#8b5cf6;
  --font:'Segoe UI',system-ui,sans-serif;
}
html,body{min-height:100vh;background:var(--bg);color:var(--diamond);font-family:var(--font);}
body::before{content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 100% 55% at 50% -5%,rgba(3,105,161,.35) 0%,transparent 70%),
             radial-gradient(ellipse 50% 40% at 90% 30%,rgba(14,116,144,.15) 0%,transparent 60%),
             linear-gradient(180deg,#030b18,#040e1f);}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}

.page{position:relative;z-index:1;}

/* Nav */
nav{display:flex;align-items:center;gap:10px;padding:14px 24px;background:rgba(3,11,24,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(56,189,248,.12);position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.nav-logo{display:flex;align-items:center;gap:8px;}
.nav-logo-icon{font-size:20px;filter:drop-shadow(0 0 10px rgba(56,189,248,.8));}
.nav-logo-text{font-size:16px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--aurora),var(--crystal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.nav-badge{padding:4px 12px;border-radius:14px;font-size:10px;font-weight:800;letter-spacing:.5px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);color:#c4b5fd;}
.spacer{flex:1;}
#shop-toggle-btn{padding:9px 20px;border-radius:22px;font-size:12px;font-weight:800;border:none;cursor:pointer;transition:all .3s;letter-spacing:.3px;}
.btn-shop-open{background:linear-gradient(135deg,#065f46,#059669);color:#fff;box-shadow:0 4px 16px rgba(5,150,105,.3);}
.btn-shop-closed{background:linear-gradient(135deg,#991b1b,#dc2626);color:#fff;box-shadow:0 4px 16px rgba(220,38,38,.25);}
#shop-toggle-btn:hover{transform:translateY(-1px);}
.nav-btn{padding:7px 14px;border-radius:18px;font-size:11px;font-weight:700;background:transparent;color:var(--frost);border:1px solid rgba(56,189,248,.2);cursor:pointer;transition:all .2s;}
.nav-btn:hover{background:rgba(56,189,248,.1);}
.nav-btn-danger{color:#fda4af;border-color:rgba(244,63,94,.25);}
.nav-btn-danger:hover{background:rgba(244,63,94,.1);}
.nav-user{font-size:11px;color:var(--aurora);background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.18);border-radius:16px;padding:5px 12px;}

/* Stats */
main{padding:24px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px;margin-bottom:32px;}
.stat-card{
  border-radius:18px;padding:22px 18px;text-align:center;position:relative;overflow:hidden;
  transition:all .35s;cursor:default;
  background:rgba(7,24,40,.82);
  border:1px solid rgba(56,189,248,.14);
  box-shadow:0 4px 24px rgba(0,0,0,.3);
}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(56,189,248,.55),transparent);
  opacity:0;transition:opacity .3s;}
.stat-card::after{content:'';position:absolute;inset:0;border-radius:18px;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(56,189,248,.07),transparent);
  pointer-events:none;}
.stat-card:hover{transform:translateY(-5px);border-color:rgba(56,189,248,.35);
  box-shadow:0 16px 48px rgba(56,189,248,.14);}
.stat-card:hover::before{opacity:1;}
.stat-label{font-size:9px;font-weight:800;color:rgba(125,211,252,.6);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:12px;}
.stat-val{font-size:42px;font-weight:900;font-family:'Courier New',monospace;
  filter:drop-shadow(0 0 8px currentColor);}
.stat-icon{font-size:20px;margin-bottom:6px;opacity:.7;}

/* Toolbar */
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.section-title{font-size:22px;font-weight:900;
  background:linear-gradient(135deg,var(--aurora),var(--crystal));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.count-pill{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.25);
  border-radius:14px;padding:4px 14px;font-size:11px;font-weight:800;color:var(--frost);}
.toolbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.filter-btn{padding:8px 16px;border-radius:18px;font-size:11px;font-weight:700;
  border:1px solid rgba(56,189,248,.18);background:transparent;color:var(--frost);
  cursor:pointer;transition:all .25s;}
.filter-btn:hover{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.3);}
.filter-btn.active{
  background:linear-gradient(135deg,rgba(3,105,161,.55),rgba(14,116,144,.55));
  border-color:rgba(56,189,248,.5);color:var(--aurora);
  box-shadow:0 0 20px rgba(56,189,248,.18),inset 0 1px 0 rgba(255,255,255,.08);}
.search-input{padding:9px 18px;border-radius:18px;background:rgba(3,11,24,.75);
  border:1px solid rgba(56,189,248,.2);color:var(--diamond);font-size:12px;outline:none;
  width:220px;font-family:var(--font);transition:all .25s;}
.search-input::placeholder{color:rgba(125,211,252,.35);}
.search-input:focus{border-color:rgba(56,189,248,.55);box-shadow:0 0 0 3px rgba(56,189,248,.1);}

/* Table */
.table-wrap{background:rgba(7,24,40,.65);border:1px solid rgba(56,189,248,.14);
  border-radius:18px;overflow:hidden;overflow-x:auto;
  box-shadow:0 8px 40px rgba(0,0,0,.3);}
table{width:100%;border-collapse:collapse;min-width:780px;}
thead tr{background:linear-gradient(180deg,rgba(3,11,24,.95),rgba(5,16,32,.9));}
th{padding:14px 14px;text-align:left;font-size:9px;font-weight:800;color:rgba(125,211,252,.6);
  text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;
  border-bottom:1px solid rgba(56,189,248,.14);}
td{padding:13px 14px;font-size:12px;border-top:1px solid rgba(56,189,248,.06);
  vertical-align:middle;}
tr:hover td{background:rgba(56,189,248,.04);border-top-color:rgba(56,189,248,.1);}

.oid-cell{font-size:20px;font-weight:900;letter-spacing:3px;font-family:'Courier New',monospace;
  background:linear-gradient(135deg,#fbbf24,var(--aurora),var(--crystal));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 6px rgba(251,191,36,.3));}

.s-badge{padding:5px 12px;border-radius:14px;font-size:10px;font-weight:800;
  letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;}
.s-pending{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fcd34d;
  box-shadow:0 0 10px rgba(245,158,11,.1);}
.s-confirmed{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.35);color:var(--frost);
  box-shadow:0 0 10px rgba(56,189,248,.1);}
.s-ready{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.35);color:#6ee7b7;
  box-shadow:0 0 10px rgba(16,185,129,.12);}
.s-completed{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.22);color:#34d399;}
.s-cancelled{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.28);color:#fda4af;}

.rx-img{width:50px;height:50px;object-fit:cover;border-radius:9px;
  border:1px solid rgba(56,189,248,.3);cursor:pointer;transition:all .25s;
  box-shadow:0 2px 12px rgba(56,189,248,.12);}
.rx-img:hover{transform:scale(1.15);border-color:rgba(56,189,248,.6);
  box-shadow:0 6px 20px rgba(56,189,248,.25);}

.status-sel{background:rgba(3,11,24,.85);border:1px solid rgba(56,189,248,.22);
  color:var(--diamond);border-radius:10px;padding:7px 11px;font-size:11px;
  outline:none;cursor:pointer;min-width:132px;font-family:var(--font);transition:all .2s;}
.status-sel:focus{border-color:rgba(56,189,248,.5);box-shadow:0 0 0 2px rgba(56,189,248,.1);}
.status-sel option{background:#071828;}
.notes-inp{background:rgba(3,11,24,.75);border:1px solid rgba(56,189,248,.16);
  color:var(--diamond);border-radius:9px;padding:6px 10px;font-size:11px;
  outline:none;width:148px;font-family:var(--font);transition:all .2s;}
.notes-inp:focus{border-color:rgba(56,189,248,.45);}
.notes-inp::placeholder{color:rgba(125,211,252,.3);}
.save-btn{padding:7px 16px;border-radius:14px;
  background:linear-gradient(135deg,#0369a1,#0ea5e9);color:#fff;
  font-size:11px;font-weight:800;border:none;cursor:pointer;transition:all .25s;
  box-shadow:0 3px 12px rgba(56,189,248,.25);}
.save-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(56,189,248,.35);}
.save-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* Image modal */
#img-modal{display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(3,11,24,.96);align-items:center;justify-content:center;
  backdrop-filter:blur(18px);}
#img-modal.show{display:flex;}
#modal-img{max-width:86vw;max-height:80vh;border-radius:16px;
  border:1px solid rgba(56,189,248,.35);box-shadow:0 0 100px rgba(56,189,248,.25);}
#modal-close{position:absolute;top:18px;right:22px;font-size:28px;cursor:pointer;
  color:var(--frost);transition:all .2s;background:rgba(3,11,24,.6);
  border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;}
#modal-close:hover{color:var(--aurora);background:rgba(56,189,248,.15);}
#modal-label{position:absolute;top:18px;left:22px;font-size:20px;font-weight:900;
  letter-spacing:4px;font-family:'Courier New',monospace;
  background:linear-gradient(135deg,#fbbf24,var(--aurora));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:none;
  padding:14px 22px;border-radius:14px;font-size:13px;font-weight:700;max-width:320px;
  backdrop-filter:blur(12px);animation:toastIn .3s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.t-ok{background:rgba(16,185,129,.18);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;
  box-shadow:0 4px 20px rgba(16,185,129,.15);}
.t-err{background:rgba(244,63,94,.14);border:1px solid rgba(244,63,94,.4);color:#fda4af;
  box-shadow:0 4px 20px rgba(244,63,94,.12);}

@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;display:inline-block;}

/* ── MOBILE ── */
@media(max-width:900px){
  nav{padding:10px 14px;gap:6px;}
  .nav-logo-text{font-size:13px;}
  .nav-badge{display:none;}
  .nav-user{font-size:10px;padding:4px 9px;}
  #shop-toggle-btn{font-size:11px;padding:7px 12px;}
  .nav-btn{font-size:11px;padding:5px 10px;}
  main{padding:16px;}
  .stats-grid{grid-template-columns:repeat(3,1fr);gap:10px;}
  .stat-card{padding:14px 10px;}
  .stat-val{font-size:26px;}
  .section-title{font-size:17px;}
  .toolbar{gap:6px;}
  .filter-btn{font-size:10px;padding:5px 10px;}
  .search-input{width:160px;font-size:11px;}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  #shop-toggle-btn{font-size:10px;padding:6px 10px;}
  .nav-btn:last-child{display:none;}
  .table-wrap{font-size:11px;}
  th{font-size:8px;padding:8px 8px;}
  td{padding:8px 8px;}
  .oid-cell{font-size:14px;letter-spacing:2px;}
  .status-sel{min-width:100px;font-size:10px;}
  .notes-inp{width:110px;font-size:10px;}
  .save-btn{padding:5px 10px;font-size:10px;}
  .rx-img{width:38px;height:38px;}
  .filter-btn{font-size:9px;padding:4px 8px;}
  .search-input{width:130px;}
}


.aurora-band{position:fixed;left:-20%;width:140%;border-radius:50%;filter:blur(5px);animation:aur linear infinite;z-index:0;pointer-events:none;}
.ab1{top:8%;height:2px;background:linear-gradient(90deg,transparent,rgba(56,189,248,.6),rgba(139,92,246,.5),transparent);animation-duration:13s;}
.ab2{top:22%;height:1px;background:linear-gradient(90deg,transparent,rgba(14,116,144,.5),rgba(56,189,248,.55),transparent);animation-duration:20s;animation-delay:-7s;}
.ab3{top:65%;height:2px;background:linear-gradient(90deg,transparent,rgba(99,102,241,.4),rgba(56,189,248,.45),transparent);animation-duration:17s;animation-delay:-4s;}
@keyframes aur{0%{transform:translateX(-20%) scaleY(1);}50%{transform:translateX(15%) scaleY(4);}100%{transform:translateX(-20%) scaleY(1);}}

/* ── GLOBAL MOBILE FIX ── */
@media(max-width:600px){
  html{font-size:15px;}
  nav{padding:10px 14px !important;gap:6px !important;flex-wrap:wrap;}
  .nav-logo-text{font-size:13px !important;letter-spacing:1px !important;}
  .nav-logo-icon{font-size:18px !important;}
  .spacer{display:none;}
  .nav-btn,.nav-ghost{padding:6px 10px !important;font-size:11px !important;}
  .nav-user{font-size:11px !important;padding:4px 10px !important;}
  main,.section{padding:20px 14px !important;}
  h1{font-size:clamp(26px,9vw,44px) !important;}
  .hero-sub{font-size:13px !important;}
  .btn{width:100% !important;max-width:100% !important;padding:13px 20px !important;font-size:14px !important;}
  .hero-btns{flex-direction:column !important;align-items:stretch !important;}
  .grid-4{grid-template-columns:1fr 1fr !important;}
  .steps{grid-template-columns:1fr 1fr !important;}
  .stats-grid{grid-template-columns:repeat(3,1fr) !important;gap:8px !important;}
  .stat-val{font-size:28px !important;}
  .stat-card{padding:14px 8px !important;}
  .auth-card{padding:28px 18px !important;margin:0 8px;}
  .card{padding:22px 16px !important;border-radius:16px !important;}
  .oc-id{font-size:22px !important;letter-spacing:3px !important;}
  .order-card{padding:16px !important;}
  .oc-img{width:56px !important;height:56px !important;}
  .s-badge{font-size:10px !important;padding:5px 10px !important;}
  .page-title{font-size:26px !important;}
  table{min-width:600px !important;}
  th{font-size:8px !important;padding:8px 8px !important;}
  td{padding:8px 8px !important;font-size:11px !important;}
  .filter-btn{font-size:10px !important;padding:6px 10px !important;}
  .search-input{width:100% !important;}
  .toolbar{flex-direction:column !important;align-items:stretch !important;}
  .action-btn{justify-content:center !important;}
  .dx-grid{grid-template-columns:1fr 1fr !important;}
  .dx-inner{padding:20px 14px 40px !important;}
  .dx-title{font-size:22px !important;}
  .gender-row{flex-direction:row !important;gap:8px !important;}
  .gender-btn{padding:12px 8px !important;font-size:18px !important;}
  .profile-banner{gap:12px !important;padding:16px !important;}
  .dx-open-btn{font-size:12px !important;padding:8px 14px !important;}
  .profile-avatar,.profile-avatar-placeholder{width:56px !important;height:56px !important;}
  .r-id{font-size:32px !important;letter-spacing:5px !important;}
  footer{font-size:11px !important;padding:20px 14px !important;}
  #qr-section{padding:32px 14px !important;}
  #qr-img{width:150px !important;height:150px !important;}
}
@media(max-width:400px){
  .stats-grid{grid-template-columns:repeat(2,1fr) !important;}
  .grid-4{grid-template-columns:1fr !important;}
  .steps{grid-template-columns:1fr !important;}
  nav .nav-btn:not(:first-of-type){display:none !important;}
}

/* Action buttons in table */
.action-group{display:flex;flex-direction:column;gap:6px;min-width:170px;}
.act-btn{padding:7px 14px;border-radius:12px;font-size:11px;font-weight:800;border:none;
  cursor:pointer;transition:all .22s;white-space:nowrap;}
.act-btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-accept{background:linear-gradient(135deg,#0369a1,#0ea5e9);color:#fff;
  box-shadow:0 3px 10px rgba(56,189,248,.3);}
.btn-accept:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(56,189,248,.4);}
.btn-ready{background:linear-gradient(135deg,#065f46,#10b981);color:#fff;
  box-shadow:0 3px 10px rgba(16,185,129,.3);}
.btn-ready:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,185,129,.4);}
.btn-complete{background:linear-gradient(135deg,#1d4ed8,#6366f1);color:#fff;
  box-shadow:0 3px 10px rgba(99,102,241,.3);}
.btn-complete:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(99,102,241,.4);}
.btn-cancel{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);
  color:#fda4af;font-size:10px;padding:5px 12px;}
.btn-cancel:hover:not(:disabled){background:rgba(244,63,94,.22);}
.btn-done-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;
  color:rgba(52,211,153,.8);font-weight:700;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="aurora-band ab1"></div>
<div class="aurora-band ab2"></div>
<div class="aurora-band ab3"></div>
<div class="page">

<nav>
  <div class="nav-logo">
    <span class="nav-logo-icon">❄️</span>
    <span class="nav-logo-text">RAMA CHEMIST</span>
  </div>
  <span class="nav-badge">🛡️ Admin</span>
  <div class="spacer"></div>
  <span class="nav-user" id="nav-user">Admin</span>
  <button id="shop-toggle-btn" onclick="toggleShop()">Loading…</button>
  <button class="nav-btn" onclick="loadAll()"><span id="refresh-ic">🔄</span> Refresh</button>
  <button class="nav-btn nav-btn-danger" onclick="adminLogout()">🚪 Sign Out</button>
</nav>

<main>
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-icon">📊</div><div class="stat-label">Total Orders</div><div class="stat-val" id="st-total" style="color:var(--crystal)">—</div></div>
    <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-label">Pending</div><div class="stat-val" id="st-pending" style="color:#fcd34d">—</div></div>
    <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-label">Confirmed</div><div class="stat-val" id="st-confirmed" style="color:var(--frost)">—</div></div>
    <div class="stat-card"><div class="stat-icon">💊</div><div class="stat-label">Ready</div><div class="stat-val" id="st-ready" style="color:#6ee7b7">—</div></div>
    <div class="stat-card"><div class="stat-icon">🎉</div><div class="stat-label">Completed</div><div class="stat-val" id="st-completed" style="color:#34d399">—</div></div>
    <div class="stat-card"><div class="stat-icon">❌</div><div class="stat-label">Cancelled</div><div class="stat-val" id="st-cancelled" style="color:#fda4af">—</div></div>
  </div>

  <!-- Orders -->
  <div class="section-head">
    <div class="section-title">📋 All Orders</div>
    <span class="count-pill" id="order-count">0</span>
  </div>
  <div class="toolbar">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('pending',this)">⏳ Pending</button>
    <button class="filter-btn" onclick="setFilter('confirmed',this)">✅ Confirmed</button>
    <button class="filter-btn" onclick="setFilter('ready',this)">💊 Ready</button>
    <button class="filter-btn" onclick="setFilter('completed',this)">🎉 Done</button>
    <button class="filter-btn" onclick="setFilter('cancelled',this)">❌ Cancelled</button>
    <input class="search-input" id="search" placeholder="🔍 Search order ID or contact…" oninput="renderTable()" autocomplete="off" name="admin_search_x9z"/>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Order ID</th>
        <th>Prescription</th>
        <th>Contact</th>
        <th>Placed</th>
        <th>Status</th>
        <th>Actions &amp; Notes</th>
      </tr></thead>
      <tbody id="orders-body">
        <tr><td colspan="6" style="text-align:center;padding:32px;color:rgba(125,211,252,.4);">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Settings Panel -->
  <div style="margin-top:36px;background:rgba(5,16,32,.8);border:1px solid rgba(56,189,248,.18);border-radius:20px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.2);">
    <div style="font-size:18px;font-weight:900;margin-bottom:20px;background:linear-gradient(135deg,var(--aurora),var(--crystal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">⚙️ Settings</div>
    <div style="max-width:360px;">
      <label style="display:block;font-size:10px;font-weight:800;color:rgba(125,211,252,.7);margin-bottom:7px;letter-spacing:1px;text-transform:uppercase;">🏪 Shop Name</label>
      <input type="text" id="shop-name-inp" placeholder="Rama Chemist & Pharmacy" autocomplete="off"
        style="width:100%;padding:11px 14px;background:rgba(3,11,24,.8);border:1px solid rgba(56,189,248,.2);border-radius:10px;color:var(--diamond);font-size:13px;outline:none;font-family:var(--font);"
        onfocus="this.style.borderColor='rgba(56,189,248,.55)'" onblur="this.style.borderColor='rgba(56,189,248,.2)'"/>
    </div>
    <button onclick="saveSettings()" style="margin-top:18px;padding:11px 28px;border-radius:22px;background:linear-gradient(135deg,#0369a1,#0ea5e9);color:#fff;font-size:13px;font-weight:800;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(56,189,248,.3);transition:all .3s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">💾 Save Settings</button>
  </div>
</main>
</div>

<!-- Image modal -->
<div id="img-modal" onclick="closeModal()">
  <div id="modal-label"></div>
  <span id="modal-close">✕</span>
  <img id="modal-img" src="" alt="Prescription"/>
</div>

<div id="toast"></div>

<script>
const API=window.location.origin;
const CACHE_KEY='rama_admin_cache';
let adminUser=null,allOrders=[],currentFilter='all',shopOpen=true;

// ── Crystal/frost particle system (performance-optimised) ──────────────────────────
(function(){
  const c=document.getElementById('canvas'),ctx=c.getContext('2d');
  let W,H;
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
  resize();window.addEventListener('resize',resize);
  const isMobile=innerWidth<768;
  const COUNT=isMobile?40:70;
  const GLOW=!isMobile;
  function mkp(){return{x:Math.random()*innerWidth,y:Math.random()*innerHeight,size:Math.random()*14+5,op:0,maxOp:Math.random()*.5+.15,phase:0,hold:90+Math.random()*130,holdN:0,spd:Math.random()*.006+.003,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.35-.06,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.02,type:Math.random()<.28?'d':Math.random()<.52?'h':Math.random()<.72?'x':'dot'};}
  const pts=Array.from({length:COUNT},()=>{const p=mkp();p.op=Math.random()*p.maxOp;p.phase=1;p.holdN=Math.floor(Math.random()*p.hold);return p;});
  let last=0;
  function draw(ts){
    requestAnimationFrame(draw);
    if(ts-last<34)return;
    last=ts;
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      if(p.phase===0){p.op+=p.spd;if(p.op>=p.maxOp){p.op=p.maxOp;p.phase=1;}}
      else if(p.phase===1){p.holdN++;if(p.holdN>=p.hold)p.phase=2;}
      else{p.op-=p.spd;if(p.op<=0){Object.assign(p,mkp());p.op=0;p.phase=0;p.holdN=0;}}
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;
      if(p.x<-40)p.x=W+40;if(p.x>W+40)p.x=-40;if(p.y<-40)p.y=H+40;if(p.y>H+40)p.y=-40;
      const o=p.op,s=p.size;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      if(GLOW){ctx.shadowColor=`rgba(56,189,248,${o*.8})`;ctx.shadowBlur=s*2.5;}
      if(p.type==='d'){ctx.rotate(Math.PI/4);ctx.fillStyle=`rgba(56,189,248,${o*.5})`;ctx.strokeStyle=`rgba(186,230,253,${o})`;ctx.lineWidth=.8;ctx.beginPath();ctx.rect(-s*.55,-s*.55,s*1.1,s*1.1);ctx.fill();ctx.stroke();}
      else if(p.type==='h'){ctx.strokeStyle=`rgba(125,211,252,${o})`;ctx.lineWidth=.8;ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;i?ctx.lineTo(s*Math.cos(a),s*Math.sin(a)):ctx.moveTo(s*Math.cos(a),s*Math.sin(a));}ctx.closePath();ctx.stroke();}
      else if(p.type==='x'){ctx.strokeStyle=`rgba(186,230,253,${o})`;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(-s*.65,0);ctx.lineTo(s*.65,0);ctx.moveTo(0,-s*.65);ctx.lineTo(0,s*.65);ctx.rotate(Math.PI/4);ctx.moveTo(-s*.45,0);ctx.lineTo(s*.45,0);ctx.moveTo(0,-s*.45);ctx.lineTo(0,s*.45);ctx.stroke();}
      else{ctx.beginPath();ctx.arc(0,0,s*.35,0,Math.PI*2);ctx.fillStyle=`rgba(186,230,253,${o})`;ctx.fill();}
      ctx.restore();
    });
  }
  requestAnimationFrame(draw);
})();

// ── Session helpers ───────────────────────────────────────────────────────────
function loadSession(){try{const u=JSON.parse(localStorage.getItem('chem_user')||'null');if(u&&u._exp>Date.now())return u;localStorage.removeItem('chem_user');return null;}catch{return null;}}

// ── Auth ───────────────────────────────────────────────────────────────────────
adminUser=loadSession();
if(!adminUser||adminUser.role!=='admin'){
  window.location.href='login.html';
} else {
  document.getElementById('nav-user').textContent=adminUser.identifier;
  init();
}

// ── Init: show cached data instantly, then fetch fresh ─────────────────────────
function init(){
  loadCachedData();        // instant render from localStorage — no waiting
  loadDashboard();         // single API call for everything
  loadSettings();
  setInterval(loadDashboard, 20000);  // refresh every 20s
}

function loadCachedData(){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    if(!raw)return;
    const cached=JSON.parse(raw);
    if(cached.orders&&cached.orders.length){
      allOrders=cached.orders;
      renderTable();
    }
    if(cached.stats)updateStats(cached.stats);
    if(typeof cached.shop_open==='boolean'){shopOpen=cached.shop_open;updateShopBtn();}
  }catch(e){}
}

function saveCache(data){
  try{
    // Compress: only store fields needed for display (keeps cache under ~5KB for typical usage)
    const slim={
      orders: data.orders.map(o=>({
        order_id:o.order_id,identifier:o.identifier,image_path:o.image_path,
        status:o.status,notes:o.notes||'',created_at:o.created_at,
        customer_name:o.customer_name||''
      })),
      stats: data.stats,
      shop_open: data.shop_open,
      cached_at: Date.now()
    };
    localStorage.setItem(CACHE_KEY, JSON.stringify(slim));
  }catch(e){}
}

function adminLogout(){
  localStorage.removeItem('chem_user');
  localStorage.removeItem(CACHE_KEY);
  window.location.href='login.html';
}

// ── Single dashboard fetch (orders + stats + shop status in one request) ───────
async function loadDashboard(){
  const ic=document.getElementById('refresh-ic');ic.className='spin';
  try{
    const tok=encodeURIComponent(adminUser.token||'');
    const r=await fetch(`${API}/api/admin/dashboard?token=${tok}&limit=500`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d.success){
      allOrders=d.orders;
      shopOpen=d.shop_open;
      renderTable();
      updateStats(d.stats);
      updateShopBtn();
      saveCache(d);   // persist for next page open
    }
  }catch(e){console.error('Dashboard fetch failed:',e);}
  ic.className='';
}

// Keep legacy loadAll as alias so the Refresh button works
async function loadAll(){ await loadDashboard(); }

// ── Stats ──────────────────────────────────────────────────────────────────────
function updateStats(s){
  document.getElementById('st-total').textContent=s.total_orders??0;
  const bs=s.by_status||{};
  document.getElementById('st-pending').textContent=bs.pending||0;
  document.getElementById('st-confirmed').textContent=bs.confirmed||0;
  document.getElementById('st-ready').textContent=bs.ready||0;
  document.getElementById('st-completed').textContent=bs.completed||0;
  document.getElementById('st-cancelled').textContent=bs.cancelled||0;
}

// ── Shop toggle ────────────────────────────────────────────────────────────────
async function loadShopStatus(){
  try{
    const r=await fetch(`${API}/api/admin/shop/status?token=${encodeURIComponent(adminUser.token||'')}`);
    const d=await r.json();shopOpen=d.open;updateShopBtn();
  }catch(e){}
}
function updateShopBtn(){
  const b=document.getElementById('shop-toggle-btn');
  if(shopOpen){b.textContent='🟢 Shop OPEN — Click to Close';b.className='btn-shop-open';}
  else{b.textContent='🔴 Shop CLOSED — Click to Open';b.className='btn-shop-closed';}
}
async function toggleShop(){
  if(!confirm(`${shopOpen?'Close':'Open'} the shop?`))return;
  try{
    const fd=new FormData();fd.append('token',adminUser.token||'');
    const r=await fetch(`${API}/api/admin/shop/toggle`,{method:'POST',body:fd});
    const d=await r.json();
    if(d.success){shopOpen=d.open;updateShopBtn();toast(d.message,true);}
  }catch(e){toast('Connection error',false);}
}

// ── Table ──────────────────────────────────────────────────────────────────────
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderTable();}

const STATUS_LABELS={pending:'⏳ Pending',confirmed:'✅ Confirmed',ready:'💊 Ready',completed:'🎉 Done',cancelled:'❌ Cancelled'};

// Next workflow step for each status
const NEXT_ACTION={
  pending:{status:'confirmed',label:'✅ Accept Order',cls:'btn-accept'},
  confirmed:{status:'ready',label:'💊 Mark Ready',cls:'btn-ready'},
  ready:{status:'completed',label:'🎉 Mark Collected',cls:'btn-complete'},
};
const CAN_CANCEL=['pending','confirmed','ready'];

function renderTable(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  let list=allOrders;
  if(currentFilter!=='all')list=list.filter(o=>o.status===currentFilter);
  if(q)list=list.filter(o=>
    o.order_id.toLowerCase().includes(q)||
    o.identifier.toLowerCase().includes(q)||
    (o.customer_name||'').toLowerCase().includes(q));
  document.getElementById('order-count').textContent=list.length+' order'+(list.length!==1?'s':'');
  const tbody=document.getElementById('orders-body');
  if(!list.length){
    tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:28px;color:rgba(125,211,252,.4);">No orders found.</td></tr>';
    return;
  }
  const rows=list.map(o=>{
    const next=NEXT_ACTION[o.status];
    const canCancel=CAN_CANCEL.includes(o.status);
    const notesVal=(o.notes||'').replace(/"/g,'&quot;');
    let actHTML;
    if(next){
      actHTML=`<div class="action-group">
        <button class="act-btn ${next.cls}" onclick="updateStatus('${o.order_id}','${next.status}',this)" title="${next.label}">${next.label}</button>
        ${canCancel?`<button class="act-btn btn-cancel" onclick="updateStatus('${o.order_id}','cancelled',this)">❌ Cancel</button>`:''}
        <input class="notes-inp" id="note-${o.order_id}" placeholder="Add note…" value="${notesVal}" autocomplete="off"/>
        <button class="save-btn" onclick="saveNote('${o.order_id}',this)" style="font-size:10px;padding:5px 10px;">📝 Save Note</button>
      </div>`;
    } else {
      actHTML=`<div class="action-group"><span class="btn-done-tag">${STATUS_LABELS[o.status]}</span>
        ${o.notes?`<div style="font-size:10px;color:rgba(125,211,252,.5);margin-top:4px">📝 ${o.notes}</div>`:''}
      </div>`;
    }
    return `<tr id="row-${o.order_id}">
      <td><div class="oid-cell">${o.order_id}</div></td>
      <td><img class="rx-img" src="${o.image_path.startsWith('http')?o.image_path:API+'/uploads/'+o.image_path}" loading="lazy" onerror="this.style.display='none'" onclick="viewImg(${o.image_path.startsWith('http')?`'${o.image_path}'`:`'${API}/uploads/${o.image_path}'`},'${o.order_id}')" title="View prescription"/></td>
      <td style="font-size:11px;">${o.customer_name?`<div style="color:var(--aurora);font-weight:700;margin-bottom:3px">${o.customer_name}</div>`:''}<div style="color:rgba(125,211,252,.7)">${o.identifier}</div></td>
      <td style="color:rgba(125,211,252,.6);font-size:10px;white-space:nowrap;">${o.created_at}</td>
      <td><span class="s-badge s-${o.status}" id="badge-${o.order_id}">${STATUS_LABELS[o.status]||o.status}</span></td>
      <td>${actHTML}</td>
    </tr>`;
  });
  tbody.innerHTML=rows.join('');
}

// ── Update order status (workflow button) ─────────────────────────────────────
async function updateStatus(oid,status,btn){
  const notes=document.getElementById(`note-${oid}`)?.value||'';
  const origText=btn.textContent;
  btn.disabled=true;btn.textContent='⏳';
  try{
    const fd=new FormData();
    fd.append('token',adminUser.token||'');
    fd.append('status',status);
    fd.append('notes',notes);
    const r=await fetch(`${API}/api/admin/orders/${oid}/status`,{method:'POST',body:fd});
    const d=await r.json();
    if(d.success){
      toast(`✅ Order ${oid} → ${STATUS_LABELS[status]}`,true);
      const idx=allOrders.findIndex(o=>o.order_id===oid);
      if(idx>=0){allOrders[idx].status=status;allOrders[idx].notes=notes;}
      saveCache({orders:allOrders,stats:computeStats(),shop_open:shopOpen});
      renderTable(); // re-render so action buttons reflect new state
    }else{
      toast(d.message||'Update failed',false);
      btn.disabled=false;btn.textContent=origText;
    }
  }catch(e){
    toast('Network error',false);
    btn.disabled=false;btn.textContent=origText;
  }
}

// ── Save note only ────────────────────────────────────────────────────────────
async function saveNote(oid,btn){
  const notes=document.getElementById(`note-${oid}`)?.value||'';
  const order=allOrders.find(o=>o.order_id===oid);
  if(!order)return;
  const origText=btn.textContent;
  btn.disabled=true;btn.textContent='⏳';
  try{
    const fd=new FormData();
    fd.append('token',adminUser.token||'');
    fd.append('status',order.status);
    fd.append('notes',notes);
    const r=await fetch(`${API}/api/admin/orders/${oid}/status`,{method:'POST',body:fd});
    const d=await r.json();
    if(d.success){
      toast(`📝 Note saved for ${oid}`,true);
      const idx=allOrders.findIndex(o=>o.order_id===oid);
      if(idx>=0){allOrders[idx].notes=notes;}
    }else{toast(d.message||'Save failed',false);}
  }catch(e){toast('Network error',false);}
  btn.disabled=false;btn.textContent=origText;
}

function computeStats(){
  const bs={};
  allOrders.forEach(o=>{bs[o.status]=(bs[o.status]||0)+1;});
  return{total_orders:allOrders.length,by_status:bs};
}

// ── Image modal ────────────────────────────────────────────────────────────────
function viewImg(src,oid){document.getElementById('modal-img').src=src;document.getElementById('modal-label').textContent=oid;document.getElementById('img-modal').classList.add('show');}
function closeModal(){document.getElementById('img-modal').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ── Toast ──────────────────────────────────────────────────────────────────────
function toast(msg,ok){
  const el=document.getElementById('toast');
  el.className=ok?'t-ok':'t-err';el.textContent=msg;el.style.display='block';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',3000);
}

// ── Settings ───────────────────────────────────────────────────────────────────
async function loadSettings(){
  try{
    const tok=encodeURIComponent(adminUser.token||'');
    const r=await fetch(`${API}/api/admin/settings?token=${tok}`);
    const d=await r.json();
    if(d.success&&d.shop_name){
      document.getElementById('shop-name-inp').placeholder=d.shop_name;
    }
  }catch(e){}
}

async function saveSettings(){
  const shopName=document.getElementById('shop-name-inp').value.trim();
  if(!shopName){toast('⚠️ Enter a shop name to save',false);return;}
  try{
    const fd=new FormData();
    fd.append('token',adminUser.token||'');
    fd.append('shop_name',shopName);
    const r=await fetch(`${API}/api/admin/settings`,{method:'POST',body:fd});
    const d=await r.json();
    if(d.success){toast(d.message||'✅ Settings saved!',true);loadSettings();}
    else{toast('❌ '+(d.message||'Failed'),false);}
  }catch(e){toast('Connection error',false);}
}
</script>
</body>
</html>
